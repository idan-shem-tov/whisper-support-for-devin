[vtt]
# Whisper model: tiny, base, small, medium
model = base

# Language: auto (auto-detect), en, he, es, fr, de, etc.
language = en

# Microphone device: auto or a device name/substring
# 'auto' (recommended): Intelligently picks the best microphone
#   - Prefers headsets over built-in mics
#   - Works automatically when you switch devices
# Or specify a device name to force a specific mic (e.g., 'Jabra', 'USB')
mic_device = auto

# Sound feedback on start/stop recording: on or off
sound = on

