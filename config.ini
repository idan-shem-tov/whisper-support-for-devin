[vtt]
# Whisper model: tiny, base, small, medium
model = base

# Language: auto (auto-detect), en, he, es, fr, de, etc.
language = en

# Sound feedback on start/stop recording: on or off
sound = on

# Device index override (optional): force a specific microphone by index.
# Leave commented out to use auto-detection.
# Run "python vtt-helper.py test-mic" to see all device indices and pick the best one.
# device_index = 1
